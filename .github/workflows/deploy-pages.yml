name: Deploy Qt WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.56"
          actions-cache-folder: emsdk-cache

      - name: Install Qt for WebAssembly
        run: |
          python -m pip install "aqtinstall==3.3.0"
          aqt install-qt all_os wasm 6.8.3 wasm_singlethread \
            --autodesktop \
            --outputdir "$RUNNER_TEMP/Qt"

      - name: Build Qt WebAssembly application
        run: |
          mkdir build-wasm
          cd build-wasm
          "$RUNNER_TEMP/Qt/6.8.3/wasm_singlethread/bin/qmake" \
            ../FlappyBird.pro CONFIG+=release
          make -j2

      - name: Stage and validate site
        run: |
          mkdir site
          cp build-wasm/FlappyBird.html site/index.html
          find build-wasm -maxdepth 1 -type f \
            \( -name '*.js' -o -name '*.wasm' \) \
            -exec cp '{}' site/ \;
          cp flappy-bird-enhanced.html site/enhanced.html
          cp assets/qtlogo.svg site/qtlogo.svg
          cp assets/favicon.svg site/favicon.svg
          cp assets/favicon.ico site/favicon.ico
          python - <<'PY'
          from pathlib import Path

          index = Path("site/index.html")
          html = index.read_text(encoding="utf-8")
          if "</head>" not in html:
              raise SystemExit("Generated Qt HTML has no closing head tag")

          favicon = '    <link rel="icon" href="favicon.svg" type="image/svg+xml">\n'
          if favicon not in html:
              html = html.replace("</head>", favicon + "</head>", 1)

          # Qt's shell ships no viewport tag, so phones lay the page out at a
          # ~980px virtual width and scale it down.
          viewport = '    <meta name="viewport" content="width=device-width, initial-scale=1">\n'
          if 'name="viewport"' not in html:
              html = html.replace("</head>", viewport + "</head>", 1)

          # Qt WebAssembly rasterises QWidget content in software, which phone
          # CPUs cannot keep up with. Touch devices get the native-canvas build
          # instead; ?qt=1 overrides that.
          # Built line by line: every line here has to stay indented inside the
          # YAML block scalar, so a triple-quoted string will not do.
          redirect = "\n".join([
              '    <script>',
              '      (function () {',
              '        if (/[?&]qt=1/.test(location.search)) return;',
              "        var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;",
              '        var small = Math.min(screen.width, screen.height) < 820;',
              "        if (coarse && small) location.replace('enhanced.html');",
              '      })();',
              '    </script>',
              '',
          ])
          if "enhanced.html" not in html:
              html = html.replace("</head>", redirect + "</head>", 1)

          index.write_text(html, encoding="utf-8")
          PY
          touch site/.nojekyll
          test -s site/index.html
          test -s site/FlappyBird.js
          test -s site/FlappyBird.wasm
          test -s site/qtloader.js
          test -s site/enhanced.html
          test -s site/qtlogo.svg
          test -s site/favicon.svg
          test -s site/favicon.ico
          grep -F 'rel="icon" href="favicon.svg" type="image/svg+xml"' site/index.html
          grep -F 'name="viewport"' site/index.html
          grep -F "location.replace('enhanced.html')" site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
